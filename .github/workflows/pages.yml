name: Verify Team Command Center (/docs)

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/sync_board.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/sync_board.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_board_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify command center sync
        run: python3 scripts/sync_board.py --check
