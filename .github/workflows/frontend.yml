name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Copias del contrato al día
        working-directory: .
        run: python3 contracts/sync.py --check
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Accesibilidad (axe)
        run: npm run test:a11y
